name: Cek Cherrygram
on:
  workflow_dispatch:

jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: arsLan4k1390/Cherrygram
          ref: main_Reproducible_Builds

      - name: Cari sumber judul
        run: |
          S=TMessagesProj/src/main
          D=$S/java/org/telegram/ui/DialogsActivity.java

          echo "=== A. Semua pemakai AppName di kode (selain Dialogs) ==="
          grep -rnIE 'CG_AppName|R\.string\.AppName|"AppName"|getAppName\(|getCherryAppName' $S/java | grep -v 'DialogsActivity.java' | head -50 || true

          echo "=== B. DialogsActivity: AppName / Cherry ==="
          grep -nE 'AppName|Cherrygram|CherrygramAppearance|HeaderTitle|FolderNameInHeader' $D | head -50 || true

          echo "=== C. Resource yang isinya persis Cherrygram ==="
          grep -rnIE '>[[:space:]]*Cherrygram[[:space:]]*<' TMessagesProj/src | head -30 || true

          echo "=== D. Judul diset lewat ActionBar / helper ==="
          grep -rnIE 'FolderNameInHeader|folderNameInHeader|showAppName|headerTitle' $S/java | head -30 || true

          echo "=== E. File non-kode yang menyebut Cherrygram ==="
          grep -rlI 'Cherrygram' TMessagesProj/src --include=*.json --include=*.txt --include=*.gradle | head -20 || true
