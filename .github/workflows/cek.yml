name: Cek Cherrygram
on:
  workflow_dispatch:

jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: arsLan4k1390/Cherrygram
          ref: main_Reproducible_Builds

      - name: Cek judul
        run: |
          S=TMessagesProj/src/main
          D=$S/java/org/telegram/ui/DialogsActivity.java

          echo "=== 1. DialogsActivity sekitar judul ==="
          sed -n '3590,3604p' $D

          echo "=== 2. Semua pemakai actionBarDefaultTitle ==="
          grep -n 'actionBarDefaultTitle' $D | head -30

          echo "=== 3. ActionBar.setTitle ==="
          grep -rn --include=ActionBar.java 'void setTitle' $S/java | head

          echo "=== 4. SimpleTextView.setText ==="
          grep -rn --include=SimpleTextView.java 'setText(' $S/java | grep 'public' | head

          echo "=== 5. Cherrygram di assets / raw ==="
          grep -rIl 'Cherrygram' $S/assets $S/res*/raw 2>/dev/null | head

          echo "=== 6. Definisi AppName di semua resource ==="
          grep -rIn 'name="AppName"\|name="CG_AppName"' TMessagesProj/src | head
