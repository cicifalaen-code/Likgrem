name: Cek Cherrygram
on:
  workflow_dispatch:
jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: arsLan4k1390/Cherrygram
          ref: main_Reproducible_Builds
      - run: |
          S=TMessagesProj/src/main
          echo "--- XML resource ---"
          grep -rniE 'cherrygram' $S/res* --include=*.xml | grep -viE 'github|t\.me|http|package|authorities' | cut -c1-220 | head -80
          echo "--- file bukan kode/xml ---"
          grep -rliE 'cherrygram' $S --exclude=*.java --exclude=*.kt --exclude=*.xml | head -40
          echo "--- DialogsActivity ---"
          grep -niE 'cherry|setTitle' $S/java/org/telegram/ui/DialogsActivity.java | cut -c1-200 | head -40
