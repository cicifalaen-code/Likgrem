name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil source lengkap
        uses: actions/checkout@v4
        with:
          repository: arsLan4k1390/Cherrygram
          ref: main_Reproducible_Builds
          submodules: recursive

      - name: Ambil file dari repo sendiri
        uses: actions/checkout@v4
        with:
          path: mine

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Keystore, API, Firebase
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > Your_Key.jks
          cp mine/TMessagesProj/google-services.json TMessagesProj/google-services.json
          cp mine/TMessagesProj/google-services.json TMessagesProj_AppStandalone/google-services.json
          F=TMessagesProj/src/main/java/uz/unnarsx/cherrygram/Extra.kt
          sed -i "s|return 12345678|return $TG_API_ID|; s|return \"abcdefg\"|return \"$TG_API_HASH\"|" $F
          G=TMessagesProj_AppStandalone/build.gradle
          sed -i "s|'Your_Password'|System.getenv('KEY_PASSWORD')|g; s|'Your_Alias'|System.getenv('KEY_ALIAS')|g" $G

      - name: Nama dan logo Likgram
        run: |
          R=TMessagesProj/src/main/res-cherrygram
          M=mine/$R
          sed -i 's|^APP_PACKAGE=.*|APP_PACKAGE=com.lik.likgram|' gradle.properties
          sed -i -E 's#(name="(AppName|CG_AppName)"[^>]*>)[^<]*<#\1Likgram<#' TMessagesProj/src/main/res*/values*/*strings.xml
          mkdir -p $R/drawable-nodpi
          cp $M/drawable-nodpi/likgram_*.png $R/drawable-nodpi/
          for f in $R/mipmap-anydpi-v26/icon_launcher_cherry*.xml; do cp $M/mipmap-anydpi-v26/icon_launcher_cherry.xml "$f"; done

      - name: Ganti sisa tampilan Cherrygram
        run: |
          S=TMessagesProj/src/main
          sed -i 's/Cherrygram/Likgram/g' $S/res*/values*/*strings.xml
          sed -i 's/return "Cherrygram/return "Likgram/' $S/java/uz/unnarsx/cherrygram/core/helpers/CGResourcesHelper.kt
          I=$S/java/org/telegram/ui/IntroActivity.java
          sed -i '/titles\[0\] = ssb;/d' $I
          sed -i 's/R\.drawable\.cg_splash_static_foreground/R.mipmap.icon_launcher_cherry/' $I
          sed -i 's/logo\.setBounds(left, top, .*);/logo.setBounds(0, 0, size, size);/' $I
          sed -i -E 's#@drawable/cg_splash_animated[a-z_]*#@mipmap/icon_launcher_cherry#' $S/res*/values*/*.xml
          sed -i 's#android:drawable="@drawable/cg_splash_static_foreground"#android:width="108dp" android:height="108dp" android:drawable="@mipmap/icon_launcher_cherry"#' $S/res-cherrygram/drawable/cg_splash_static.xml

      - name: Ikon notifikasi, QR, dan pilihan ikon
        run: |
          S=TMessagesProj/src/main
          D=$S/res-cherrygram/drawable
          L='M8,3H12L9,14C7,14.5 4.5,16 3,18L5.5,6C6,4 7,3 8,3ZM3,21C5,17.5 8,16 11,16H15C15,19 13,21 10,21Z'
          B='M15,9H20C21.5,9 22.5,10 22.5,12C22.5,14 21.5,15 20,15H18.5L17,17L16.3,15H15C13.5,15 12.5,14 12.5,12C12.5,10 13.5,9 15,9ZM14.5,12a0.8,0.8 0,1 0,1.6 0a0.8,0.8 0,1 0,-1.6 0ZM16.7,12a0.8,0.8 0,1 0,1.6 0a0.8,0.8 0,1 0,-1.6 0ZM18.9,12a0.8,0.8 0,1 0,1.6 0a0.8,0.8 0,1 0,-1.6 0Z'
          A='xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"'
          P="<path android:fillType=\"evenOdd\" android:pathData=\"$L$B\""
          for n in cg_notification cg_notification_bra; do
            echo "<vector $A>$P android:fillColor=\"#FFFFFF\"/></vector>" > $D/$n.xml
          done
          logo() {
            echo "<vector $A><path android:fillColor=\"$2\" android:pathData=\"M0,12a12,12 0,1 0,24 0a12,12 0,1 0,-24 0Z\"/><group android:scaleX=\"0.72\" android:scaleY=\"0.72\" android:pivotX=\"12\" android:pivotY=\"12\">$P android:fillColor=\"$3\"/></group></vector>" > $D/$1.xml
          }
          logo cg_logo_notch '#12141C' '#D5E0F7'
          logo cg_logo_notch_white '#FFFFFF' '#12141C'
          cp $D/cg_notification.xml $D/cg_settings.xml
          cp $D/cg_notification.xml $D/cg_settings_bra.xml
          sed 's/"24dp"/"48dp"/g' $D/cg_notification.xml > $D/camera_icon_cherrygram.xml
          sed -i -E 's/R\.drawable\.notification\b/R.drawable.cg_notification/g' $S/java/org/telegram/messenger/NotificationsController.java $S/java/uz/unnarsx/cherrygram/core/helpers/CGResourcesHelper.kt
          sed -i -E '/"CG_Icon_/ s/R\.(drawable|mipmap)\.[a-z0-9_]+, R\.drawable\.icon_foreground_cherry[a-z_]*/R.drawable.likgram_bg, R.drawable.likgram_fg/' $S/java/org/telegram/ui/LauncherIconController.java

      - name: Warna biru dan matikan update
        run: |
          J=TMessagesProj/src/main/java/org/telegram/ui
          sed -i 's/startMessagingButtonBackground\.setColors(.*);/startMessagingButtonBackground.setColors(new int[]{0xFF4F7DF3, 0xFF2F4FA8});/' $J/IntroActivity.java
          sed -i '/public void checkAppUpdate(boolean force, Browser\.Progress progress, boolean updateAlways) {/a\        if (true) { if (progress != null) progress.end(); return; }' $J/LaunchActivity.java
          sed -i '/applicationLoaderInstance\.showUpdaterBottomSheet(fragment, available, update);/d' $J/LaunchActivity.java
          grep -rliE 'a33156|e54c7f|9d3254|9e3254|f6538a' TMessagesProj/src/main/java TMessagesProj/src/main/res-cherrygram | xargs sed -i 's/a33156/2F4FA8/Ig; s/e54c7f/4F7DF3/Ig; s/9d3254/2F4FA8/Ig; s/9e3254/2F4FA8/Ig; s/f6538a/4F7DF3/Ig'

      - name: Ganti sisa Cherrygram dan Telegram
        run: |
          S=TMessagesProj/src/main

          # 1. String literal "Cherrygram" di kode (hanya yang persis di dalam tanda kutip)
          grep -rlF '"Cherrygram' $S/java | xargs -r sed -i 's/"Cherrygram"/"Likgram"/g; s/"Cherrygram /"Likgram /g'

          # 2. Teks "Cherrygram" dan "Telegram" di semua strings.xml (hanya isi teks, bukan atribut name atau URL)
          find TMessagesProj/src -path '*values*' -name '*.xml' | xargs -r perl -pi -e '
            1 while s/(>[^<]*?)Cherrygram/${1}Likgram/;
            1 while s/(>[^<]*?)(?<![\/.@])Telegram(?![a-zA-Z\/.])/${1}Likgram/;
          '

          # 3. Cek sisa (cuma buat log)
          grep -rnE '"Cherrygram|>[^<]*Cherrygram' $S/java $S/res*/values* | head -30 || true

      - name: Build
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_AppStandalone:assembleStandalone --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
