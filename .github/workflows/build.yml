name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > Your_Key.jks

      - name: Set API ID & Hash
        run: |
          D=TMessagesProj/src/main/java/uz/unnarsx/cherrygram
          cp $D/Extra.kt.example $D/Extra.kt
          cp $D/chats/ui/MessageMenuHelper.java.example $D/chats/ui/MessageMenuHelper.java
          cp $D/chats/helpers/MessagesFilterHelper.kt.example $D/chats/helpers/MessagesFilterHelper.kt
          F=$D/Extra.kt
          sed -i 's|val appID: Int = 0|val appID: Int = ${{ secrets.TG_API_ID }}|' $F
          sed -i 's|val appHash: String = ""|val appHash: String = "${{ secrets.TG_API_HASH }}"|' $F

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_AppStandalone:assembleStandalone --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: TMessagesProj_AppStandalone/build/outputs/apk/**/standalone/*.apk
